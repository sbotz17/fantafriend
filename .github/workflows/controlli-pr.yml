name: controlli-pr
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Nessun segreto nei file
        run: |
          if grep -rInE "sk-[A-Za-z0-9]{10,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist .; then
            echo "::error::Possibile segreto nel repository"; exit 1
          fi
